<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROMEZA CRM</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<!-- Leaflet.markercluster: groups thousands of markers into clusters so the map
     stays smooth instead of freezing when plotting all contacts at once. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- EmailJS SDK -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<!-- SheetJS for Excel import -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<!-- Clear stale fake data before anything loads.
     Real data (4429 contacts) encrypts to >1MB blob.
     Fake data (62 contacts) is <100KB. Safe to detect without decrypting. -->
<script>
  try {
    var _enc = localStorage.getItem('promeza_data_enc');
    if (_enc && _enc.length < 200000) {
      localStorage.removeItem('promeza_data_enc');
      localStorage.removeItem('promeza_last_load');
      localStorage.removeItem('promeza_real_data_v1');
      console.log('PROMEZA: cleared stale data (' + _enc.length + ' chars)');
    }
  } catch(e) {}
</script>

<!-- MSAL.js for Microsoft Entra ID login (hosted locally) -->
<script src="msal-browser.min.js?v=194"
  onload="console.log('MSAL loaded OK, window.msal=', typeof window.msal)"
  onerror="console.error('MSAL LOCAL FILE FAILED TO LOAD')"></script>

<link rel="stylesheet" href="styles.css?v=194" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#4f46e5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="PROMEZA" />
<link rel="apple-touch-icon" href="icon-192.png" />
</head>
<body>
<div id="root"></div>

<!-- React (production build — faster, smaller than the dev build) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<!-- Data + utilities -->
<script src="data.js?v=194"></script>
<script src="data_churches.js?v=194"></script>
<script src="i18n.js?v=194"></script>
<script src="airtable.js?v=194"></script>

<!-- Precompiled app: all .jsx files transpiled to plain JS at build time.
     No in-browser Babel (removed) — this is the main load-speed win. -->
<script src="bundle.191.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    // Register the service worker. Code files are served network-first (see sw.js),
    // so a new deployment is picked up on the next reload while online — no
    // auto-reload (that risked a reload loop during CDN propagation).
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js?v=194')
        .then(r => { console.log('SW v123 registered'); r.update(); })
        .catch(e => console.warn('SW failed:', e));
    });
  }
</script>
</body>
</html>
